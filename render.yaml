services:
  - type: web
    name: future-week-adjustment
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: in-progress runs are held in this process's memory (see docs/architecture.md).
    startCommand: gunicorn -w 1 --timeout 120 -b 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DASHBOARD_SECRET
        generateValue: true
